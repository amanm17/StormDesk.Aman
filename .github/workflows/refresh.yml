name: Refresh StormDesk data

# Four runs a day. Cron is UTC; IST = UTC+5:30.
#   01:17 UTC = 06:47 IST  (after GDELT publishes yesterday's file and Asia opens)
#   07:17 UTC = 12:47 IST
#   13:17 UTC = 18:47 IST  (US open data, FRED overnight updates)
#   19:17 UTC = 00:47 IST  (after US close)
# Each run fetches every free source, re-scores, and commits the new JSON. Cloudflare
# redeploys on every push, so a refresh is a deploy. Cost: zero (no keys, no subscriptions).

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      skip_gdelt:
        description: "Skip GDELT downloads this run (use stored news history)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stormdesk-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover tests

      - name: Run pipeline
        env:
          # Optional, free: adds US CPI/jobs/GDP release dates to Event Watch.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ inputs.skip_gdelt }}" = "true" ]; then
            python -m pipeline.run --skip-gdelt
          else
            python -m pipeline.run
          fi

      - name: Commit refreshed data
        run: |
          git config user.name "stormdesk-bot"
          git config user.email "stormdesk-bot@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          GLOBAL=$(python -c "import json;s=json.load(open('public/data/latest_snapshot.json'));print(f\"{s['global']['score']} {s['global']['weather']}\")")
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ) · global ${GLOBAL}"
          git push
